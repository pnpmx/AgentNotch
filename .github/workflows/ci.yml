name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check scripts and metadata
        run: |
          zsh -n scripts/build-app.sh scripts/install-local.sh scripts/configure-claude.sh
          plutil -lint Resources/Info.plist
          git diff --check
      - name: Build
        run: swift build -c release -Xswiftc -warnings-as-errors
      - name: Parser checks
        run: .build/release/AgentNotch --self-test
      - name: Behavioral regression tests
        run: swift test -Xswiftc -warnings-as-errors
