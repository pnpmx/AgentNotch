name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build the disk image for
        required: true

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # Optional: with these secrets the app is Developer ID signed and
      # notarized, so macOS opens it without a warning.
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Test
        run: |
          swift build -c release -Xswiftc -warnings-as-errors
          .build/release/AgentNotch --self-test
      - name: Build app
        run: |
          app=$(scripts/build-app.sh release | tail -1)
          mkdir -p dist
          cp -R "$app" dist/AgentNotch.app
      - name: Developer ID signing
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          identity=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          codesign --force --options runtime --timestamp \
            --entitlements Resources/AgentNotch.entitlements --sign "$identity" dist/AgentNotch.app
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Disk image
        run: |
          scripts/make-dmg.sh dist/AgentNotch.app dist/AgentNotch-mac.dmg
          if [ -n "${SIGNING_IDENTITY:-}" ]; then
            codesign --force --timestamp --sign "$SIGNING_IDENTITY" dist/AgentNotch-mac.dmg
            xcrun notarytool submit dist/AgentNotch-mac.dmg --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple dist/AgentNotch-mac.dmg
          fi
          cd dist && shasum -a 256 AgentNotch-mac.dmg > SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          awk -v v="## $version" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          if [ -n "${SIGNING_IDENTITY:-}" ]; then
            printf '\n**Install:** download `AgentNotch-mac.dmg`, open it and drag AgentNotch to Applications. macOS 26+, Apple Silicon.\n' >> notes.md
          else
            printf '\n**Install:** download `AgentNotch-mac.dmg`, open it and drag AgentNotch to Applications (macOS 26+, Apple Silicon). This build is not notarized: the first time, open it, then go to System Settings → Privacy & Security and click **Open Anyway**.\n' >> notes.md
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/AgentNotch-mac.dmg dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/AgentNotch-mac.dmg dist/SHA256SUMS.txt --latest \
              --title "AgentNotch for macOS $TAG" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          fi
